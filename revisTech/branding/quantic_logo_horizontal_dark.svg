<svg viewBox="0 0 400 140" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
    .logo-brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 56px;
      font-weight: 700;
      fill: url(#gradient-brand);
      letter-spacing: -1px;
    }
    .logo-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #94A3B8;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
  </style>

  <defs>
    <linearGradient id="gradient-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Quantum Qubit Symbol -->
  <g id="qubit" transform="translate(50, 50)">
    <!-- Outer Ring (Quantum) -->
    <circle cx="40" cy="40" r="33" fill="none" stroke="#00D9FF" stroke-width="1.2" opacity="0.6"/>

    <!-- Superposition Rings -->
    <circle cx="40" cy="40" r="25" fill="none" stroke="#8B5CF6" stroke-width="0.9" opacity="0.5" stroke-dasharray="3,3"/>
    <circle cx="40" cy="40" r="17" fill="none" stroke="#00D9FF" stroke-width="1.2" opacity="0.8"/>

    <!-- AI Agent Nodes -->
    <circle cx="40" cy="21" r="3.6" fill="#00D9FF"/>
    <circle cx="60" cy="36" r="3.6" fill="#8B5CF6"/>
    <circle cx="57" cy="57" r="3.6" fill="#00D9FF"/>
    <circle cx="27" cy="57" r="3.6" fill="#8B5CF6"/>
    <circle cx="24" cy="36" r="3.6" fill="#00D9FF"/>

    <!-- Connection Lines (Neural Networks) -->
    <line x1="40" y1="21" x2="60" y2="36" stroke="#00D9FF" stroke-width="0.6" opacity="0.6"/>
    <line x1="60" y1="36" x2="57" y2="57" stroke="#8B5CF6" stroke-width="0.6" opacity="0.6"/>
    <line x1="57" y1="57" x2="27" y2="57" stroke="#00D9FF" stroke-width="0.6" opacity="0.6"/>
    <line x1="27" y1="57" x2="24" y2="36" stroke="#8B5CF6" stroke-width="0.6" opacity="0.6"/>
    <line x1="24" y1="36" x2="40" y2="21" stroke="#00D9FF" stroke-width="0.6" opacity="0.6"/>

    <!-- Central Core (Human Supervision) -->
    <circle cx="40" cy="40" r="2.4" fill="#FF6B6B"/>

    <!-- Quantum Wave Pattern -->
    <path d="M 27 40 Q 33 33 40 39 T 53 40" fill="none" stroke="#00D9FF" stroke-width="0.9" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="130" y="55" class="logo-brand-name">Quantic</text>
  <text x="130" y="75" class="logo-brand-name" style="font-size: 56px;">IA</text>
  <text x="130" y="95" class="logo-subtitle">Magazine</text>
</svg>