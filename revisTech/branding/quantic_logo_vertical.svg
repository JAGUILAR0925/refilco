<svg viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@700&display=swap');
    .logo-brand-name {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 42px;
      font-weight: 700;
      fill: url(#gradient-brand);
      letter-spacing: -0.5px;
      text-anchor: middle;
    }
    .logo-subtitle {
      font-family: 'Space Grotesk', sans-serif;
      font-size: 11px;
      font-weight: 600;
      fill: #94A3B8;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-anchor: middle;
    }
  </style>

  <defs>
    <linearGradient id="gradient-brand" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#00D9FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8B5CF6;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Quantum Qubit Symbol -->
  <g id="qubit" transform="translate(100, 80)">
    <!-- Outer Ring (Quantum) -->
    <circle cx="0" cy="0" r="55" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.6"/>

    <!-- Superposition Rings -->
    <circle cx="0" cy="0" r="42" fill="none" stroke="#8B5CF6" stroke-width="1.5" opacity="0.5" stroke-dasharray="5,5"/>
    <circle cx="0" cy="0" r="28" fill="none" stroke="#00D9FF" stroke-width="2" opacity="0.8"/>

    <!-- AI Agent Nodes -->
    <circle cx="0" cy="-35" r="6" fill="#00D9FF"/>
    <circle cx="30" cy="-10" r="6" fill="#8B5CF6"/>
    <circle cx="25" cy="25" r="6" fill="#00D9FF"/>
    <circle cx="-25" cy="25" r="6" fill="#8B5CF6"/>
    <circle cx="-30" cy="-10" r="6" fill="#00D9FF"/>

    <!-- Connection Lines (Neural Networks) -->
    <line x1="0" y1="-35" x2="30" y2="-10" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
    <line x1="30" y1="-10" x2="25" y2="25" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
    <line x1="25" y1="25" x2="-25" y2="25" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>
    <line x1="-25" y1="25" x2="-30" y2="-10" stroke="#8B5CF6" stroke-width="1" opacity="0.6"/>
    <line x1="-30" y1="-10" x2="0" y2="-35" stroke="#00D9FF" stroke-width="1" opacity="0.6"/>

    <!-- Central Core (AI Agent) -->
    <circle cx="0" cy="0" r="4" fill="#FF6B6B"/>

    <!-- Quantum Wave Pattern -->
    <path d="M -25 0 Q -15 -15 0 -5 T 25 0" fill="none" stroke="#00D9FF" stroke-width="1.5" opacity="0.4"/>
  </g>

  <!-- Text -->
  <text x="100" y="220" class="logo-brand-name">Quantic</text>
  <text x="100" y="265" class="logo-brand-name" style="font-size: 42px;">IA</text>
  <text x="100" y="290" class="logo-subtitle">Magazine</text>
</svg>